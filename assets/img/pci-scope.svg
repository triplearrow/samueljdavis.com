<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="t5 d5" width="520" height="320">
  <title id="t5">PCI DSS scope reduction</title>
  <desc id="d5">A large cardholder data environment shrinks by roughly half over three years, cutting the systems in audit scope.</desc>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#9A938A" letter-spacing="2">
    <text x="8" y="20">YEAR 0</text>
    <text x="512" y="20" text-anchor="end">YEAR 3</text>
  </g>

  <!-- before blob -->
  <rect x="8" y="36" width="196" height="196" rx="10" fill="#F2EFEA" stroke="#DCD6CD"/>
  <g fill="#8C857B">
    <rect x="26" y="54" width="30" height="30" rx="4"/><rect x="66" y="54" width="30" height="30" rx="4"/>
    <rect x="106" y="54" width="30" height="30" rx="4"/><rect x="146" y="54" width="30" height="30" rx="4"/>
    <rect x="26" y="94" width="30" height="30" rx="4"/><rect x="66" y="94" width="30" height="30" rx="4"/>
    <rect x="106" y="94" width="30" height="30" rx="4"/><rect x="146" y="94" width="30" height="30" rx="4"/>
    <rect x="26" y="134" width="30" height="30" rx="4"/><rect x="66" y="134" width="30" height="30" rx="4"/>
    <rect x="106" y="134" width="30" height="30" rx="4"/><rect x="146" y="134" width="30" height="30" rx="4"/>
    <rect x="26" y="174" width="30" height="30" rx="4"/><rect x="66" y="174" width="30" height="30" rx="4"/>
    <rect x="106" y="174" width="30" height="30" rx="4"/><rect x="146" y="174" width="30" height="30" rx="4"/>
  </g>
  <text x="106" y="254" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="12" fill="#6F685F">systems in scope</text>

  <!-- arrow -->
  <g transform="translate(224 122)">
    <path d="M0 12h58" stroke="#E2600F" stroke-width="2"/>
    <path d="M50 4l10 8-10 8" fill="none" stroke="#E2600F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="-4" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace"
          font-size="13" fill="#E2600F" font-weight="700">−50%</text>
  </g>
  <text x="260" y="278" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="11" fill="#9A938A">segment · retire · tokenize · consolidate</text>

  <!-- after blob -->
  <rect x="316" y="36" width="196" height="196" rx="10" fill="#FFF2E8" stroke="#F0C9A6"/>
  <g fill="#E2600F">
    <rect x="356" y="94" width="30" height="30" rx="4"/><rect x="396" y="94" width="30" height="30" rx="4"/>
    <rect x="436" y="94" width="30" height="30" rx="4"/>
    <rect x="356" y="134" width="30" height="30" rx="4"/><rect x="396" y="134" width="30" height="30" rx="4"/>
    <rect x="436" y="134" width="30" height="30" rx="4"/>
  </g>
  <g fill="none" stroke="#E4DDD3" stroke-dasharray="4 4">
    <rect x="356" y="54" width="30" height="30" rx="4"/><rect x="396" y="54" width="30" height="30" rx="4"/>
    <rect x="436" y="54" width="30" height="30" rx="4"/>
    <rect x="356" y="174" width="30" height="30" rx="4"/><rect x="396" y="174" width="30" height="30" rx="4"/>
    <rect x="436" y="174" width="30" height="30" rx="4"/>
  </g>
  <text x="414" y="254" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="12" fill="#6F685F">less to audit, less to defend</text>

  <text x="260" y="308" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" fill="#33302C">The cheapest control is the system you no longer have.</text>
</svg>
