<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" role="img" aria-labelledby="t2 d2" width="420" height="480">
  <title id="t2">Samuel J. Davis identity plate</title>
  <desc id="d2">A dark identity card bearing the initials S J D, a CISSP mark, and a clearance-style stamp.</desc>

  <rect width="420" height="480" rx="14" fill="#1A1917"/>
  <rect x="14" y="14" width="392" height="452" rx="8" fill="none" stroke="#3E3A34"/>

  <!-- punch-card / register rail -->
  <g fill="#2C2925">
    <rect x="30" y="34" width="360" height="26" rx="4"/>
  </g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#8C857B" letter-spacing="2.2">
    <text x="44" y="52">ID // PATASKALA-OH</text>
    <text x="376" y="52" text-anchor="end" fill="#E2600F">ACTIVE</text>
  </g>

  <!-- initials -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="150" fill="#F5F2ED" letter-spacing="-4">
    <text x="46" y="228">SJ</text>
  </g>
  <text x="46" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700"
        font-size="150" fill="none" stroke="#E2600F" stroke-width="2" letter-spacing="-4">D</text>

  <!-- scanline accent -->
  <g stroke="#E2600F" stroke-opacity=".35">
    <path d="M244 262h132M244 274h132M244 286h96"/>
  </g>

  <!-- shield stamp -->
  <g transform="translate(268 168)">
    <path d="M36 0 72 14v28c0 22-16 40-36 48-20-8-36-26-36-48V14z" fill="none" stroke="#E2600F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M20 44l11 11 21-23" fill="none" stroke="#E2600F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- footer band -->
  <rect x="30" y="380" width="360" height="1" fill="#3E3A34"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#B4ADA2" letter-spacing="1.4">
    <text x="30" y="412">CISSP · (ISC)²  ·  2019</text>
    <text x="30" y="438" fill="#7E776D">U.S. ARMY · MP SERGEANT</text>
  </g>
</svg>
