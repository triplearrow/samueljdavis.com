<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-labelledby="rm-t rm-d" width="400" height="240">
  <title id="rm-t">Where I'll work</title>
  <desc id="rm-d">Two options: on site or hybrid across the Columbus, Ohio metro, or fully remote anywhere.</desc>

  <g transform="translate(116 120)">
    <!-- remote: anywhere -->
    <circle r="96" fill="none" stroke="#B4ADA2" stroke-width="1.2" stroke-dasharray="5 6"/>
    <!-- metro: on site or hybrid -->
    <circle r="50" fill="#E2600F" fill-opacity=".09" stroke="#E2600F" stroke-width="1.6"/>
    <circle r="4.5" fill="#E2600F"/>
  </g>

  <!-- legend -->
  <g transform="translate(242 100)">
    <circle r="6.5" fill="#E2600F" fill-opacity=".18" stroke="#E2600F" stroke-width="1.6"/>
    <text x="18" y="4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5"
          letter-spacing="1" fill="#1A1917">COLUMBUS METRO</text>
    <text x="18" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11"
          fill="#6B655C">on site or hybrid</text>
  </g>

  <g transform="translate(242 156)">
    <circle r="6.5" fill="none" stroke="#B4ADA2" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="18" y="4" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5"
          letter-spacing="1" fill="#1A1917">REMOTE</text>
    <text x="18" y="20" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11"
          fill="#6B655C">anywhere</text>
  </g>
</svg>
