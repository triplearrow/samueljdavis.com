<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t1 d1" width="640" height="640">
  <title id="t1">Layered defense lattice</title>
  <desc id="d1">Concentric rings of controls with an inbound attack path stopped before it reaches the core.</desc>

  <defs>
    <radialGradient id="hl-core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#43403A"/>
      <stop offset="1" stop-color="#1A1917"/>
    </radialGradient>
    <linearGradient id="hl-path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2600F" stop-opacity=".15"/>
      <stop offset="1" stop-color="#E2600F"/>
    </linearGradient>
  </defs>

  <!-- faint measuring grid -->
  <g stroke="#E6E2DB" stroke-width="1">
    <path d="M0 160H640M0 320H640M0 480H640M160 0V640M320 0V640M480 0V640"/>
  </g>

  <!-- rings -->
  <g fill="none" stroke="#CFC9C0">
    <circle cx="320" cy="320" r="280" stroke-dasharray="2 9" stroke-linecap="round"/>
    <circle cx="320" cy="320" r="210"/>
    <circle cx="320" cy="320" r="140" stroke-dasharray="10 7"/>
  </g>
  <circle cx="320" cy="320" r="70" fill="none" stroke="#E2600F" stroke-width="2"/>

  <!-- spokes -->
  <g stroke="#E0DBD3" stroke-width="1">
    <path d="M320 320 583 224M320 320 393 50M320 320 106 140M320 320 57 416M320 320 248 590M320 320 500 535"/>
  </g>

  <!-- perimeter nodes -->
  <g fill="#FFFFFF" stroke="#9A938A" stroke-width="1.5">
    <circle cx="583" cy="224" r="7"/><circle cx="393" cy="50" r="7"/><circle cx="106" cy="140" r="7"/>
    <circle cx="57" cy="416" r="7"/><circle cx="248" cy="590" r="7"/><circle cx="500" cy="535" r="7"/>
  </g>
  <g fill="#FFFFFF" stroke="#7A736A" stroke-width="1.5">
    <circle cx="469" cy="172" r="6"/><circle cx="248" cy="123" r="6"/><circle cx="111" cy="302" r="6"/>
    <circle cx="215" cy="502" r="6"/><circle cx="425" cy="502" r="6"/>
  </g>
  <g fill="#33302C">
    <circle cx="441" cy="250" r="5"/><circle cx="296" cy="182" r="5"/><circle cx="185" cy="284" r="5"/>
    <circle cx="230" cy="427" r="5"/><circle cx="368" cy="452" r="5"/>
  </g>

  <!-- inbound attack path, halted at the inner control ring -->
  <path d="M583 224 469 172 441 250 396 286" fill="none" stroke="url(#hl-path)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <g stroke="#E2600F" stroke-width="3" stroke-linecap="round">
    <path d="M383 273 409 299M409 273 383 299"/>
  </g>

  <!-- core -->
  <circle cx="320" cy="320" r="46" fill="url(#hl-core)"/>
  <g fill="none" stroke="#E2600F" stroke-width="2" stroke-linejoin="round">
    <path d="M320 300 336 307v11c0 8-7 15-16 19-9-4-16-11-16-19v-11z"/>
  </g>
  <circle cx="320" cy="320" r="46" fill="none" stroke="#E2600F" stroke-opacity=".45"/>

  <!-- ring labels -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#8C857B" letter-spacing="1.5">
    <text x="320" y="30" text-anchor="middle">PERIMETER</text>
    <text x="320" y="126" text-anchor="middle">IDENTITY</text>
    <text x="320" y="196" text-anchor="middle">DATA</text>
  </g>
</svg>
