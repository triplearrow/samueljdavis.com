<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" role="img" aria-labelledby="t7 d7" width="440" height="380">
  <title id="t7">Third-party and SaaS risk funnel</title>
  <desc id="d7">Twenty or more vendors a year are triaged, assessed, and either approved, approved with conditions, or rejected before procurement signs.</desc>

  <text x="220" y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12" fill="#9A938A" letter-spacing="2">20+ VENDORS / YEAR</text>

  <!-- inbound vendor tiles -->
  <g fill="#F2EFEA" stroke="#DCD6CD">
    <rect x="24" y="38" width="34" height="24" rx="4"/><rect x="66" y="38" width="34" height="24" rx="4"/>
    <rect x="108" y="38" width="34" height="24" rx="4"/><rect x="150" y="38" width="34" height="24" rx="4"/>
    <rect x="192" y="38" width="34" height="24" rx="4"/><rect x="234" y="38" width="34" height="24" rx="4"/>
    <rect x="276" y="38" width="34" height="24" rx="4"/><rect x="318" y="38" width="34" height="24" rx="4"/>
    <rect x="360" y="38" width="34" height="24" rx="4"/><rect x="45" y="72" width="34" height="24" rx="4"/>
    <rect x="87" y="72" width="34" height="24" rx="4"/><rect x="129" y="72" width="34" height="24" rx="4"/>
    <rect x="171" y="72" width="34" height="24" rx="4"/><rect x="213" y="72" width="34" height="24" rx="4"/>
    <rect x="255" y="72" width="34" height="24" rx="4"/><rect x="297" y="72" width="34" height="24" rx="4"/>
    <rect x="339" y="72" width="34" height="24" rx="4"/>
  </g>

  <!-- funnel: wide mouth, centred stem -->
  <path d="M24 112H416L240 200V254H200V200Z" fill="#FFFFFF" stroke="#DCD6CD"/>
  <path d="M24 112H416L240 200V254H200V200Z" fill="#E2600F" fill-opacity=".05" stroke="none"/>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6F685F" text-anchor="middle">
    <text x="220" y="136">1 · triage by data + access</text>
    <text x="220" y="162">2 · security review</text>
    <text x="220" y="186" font-size="9.5" fill="#33302C">3 · risk decision</text>
  </g>
  <g stroke="#EDE8E1"><path d="M60 144h320M112 170h216"/></g>

  <!-- procurement gate -->
  <path d="M220 254v14" stroke="#CFC9C0"/>
  <g transform="translate(130 268)">
    <rect width="180" height="30" rx="6" fill="#1A1917"/>
    <text x="90" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace"
          font-size="11" fill="#E2600F" letter-spacing="1.2">PROCUREMENT GATE</text>
  </g>

  <!-- outcomes -->
  <g stroke="#CFC9C0" fill="none"><path d="M220 298v14h-98v14M220 312h98v14M220 312v14"/></g>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">
    <rect x="76" y="326" width="92" height="28" rx="5" fill="#FFF2E8" stroke="#F0C9A6"/>
    <text x="122" y="344" fill="#E2600F">approved</text>
    <rect x="174" y="326" width="92" height="28" rx="5" fill="#F2EFEA" stroke="#DCD6CD"/>
    <text x="220" y="344" fill="#6F685F">conditions</text>
    <rect x="272" y="326" width="92" height="28" rx="5" fill="#F2EFEA" stroke="#DCD6CD"/>
    <text x="318" y="344" fill="#6F685F">walk away</text>
  </g>

  <text x="220" y="374" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11" fill="#9A938A">“Not like that” is free before signature.</text>
</svg>
